name: Publish

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: npm run test
      - run: npm publish
